name: Build LONALOTO APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Build APK Release (non signé)
        run: gradle assembleRelease --stacktrace

      - name: Tests unitaires
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Publier l'APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publier l'APK Release
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-test-report
          path: app/build/reports/tests/
          retention-days: 14
