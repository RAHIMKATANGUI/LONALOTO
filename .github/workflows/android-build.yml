name: Build LONALOTO APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Build APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Build APK Release (non signé)
        run: ./gradlew assembleRelease --stacktrace

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Publier l'APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publier l'APK Release
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lonaloto-test-report
          path: app/build/reports/tests/
          retention-days: 14
